<!-- users/templates/users/password_reset_complete.html -->
{% extends 'base.html' %}

{% block title %}Пароль изменен - Сервис рассылок{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Пароль успешно изменен</h4>
            </div>
            <div class="card-body">
                <div class="alert alert-success">
                    <i class="fas fa-check-circle me-2"></i>
                    Ваш пароль был успешно изменен. Теперь вы можете войти в систему с новым паролем.
                </div>
                <p class="text-center mt-3">
                    <a href="{% url 'users:login' %}" class="btn btn-primary">
                        Войти в систему
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
