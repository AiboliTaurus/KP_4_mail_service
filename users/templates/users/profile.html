<!-- users/templates/users/profile.html -->
{% extends 'base.html' %}

{% block title %}Профиль пользователя{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Редактирование профиля</h4>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <!-- Отображение аватара, если есть -->
                    {% if user.avatar %}
                        <div class="text-center mb-3">
                            <img src="{{ user.avatar.url }}" alt="Аватар" class="rounded-circle" style="width: 100px; height: 100px; object-fit: cover;">
                        </div>
                    {% endif %}

                    {{ form.as_p }}

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'mailing:home' %}" class="btn btn-secondary">На главную</a>
                        <button type="submit" class="btn btn-success">Сохранить изменения</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
