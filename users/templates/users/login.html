<!-- users/templates/users/login.html -->
{% extends 'base.html' %}

{% block title %}Вход - Сервис рассылок{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Вход в систему</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
                <hr>
                <div class="text-center">
                    <p class="mb-2">
                        <a href="{% url 'password_reset' %}">Забыли пароль?</a>
                    </p>
                    <p class="mb-0">
                        Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрируйтесь</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
