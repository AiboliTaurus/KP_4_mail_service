<!-- mailing/templates/mailing/message_confirm_delete.html -->
{% extends 'base.html' %}

{% block title %}Удаление сообщения{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">
                    <i class="bi bi-exclamation-triangle"></i>
                    Подтверждение удаления
                </h4>
            </div>
            <div class="card-body">
                <p class="lead">Вы уверены, что хотите удалить сообщение?</p>

                <div class="alert alert-warning">
                    <h5 class="alert-heading">{{ object.subject }}</h5>
                    <p class="mb-0">{{ object.body|truncatechars:100 }}</p>
                </div>

                <p class="text-danger">
                    <strong>⚠️ Это действие нельзя отменить!</strong>
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'mailing:message_detail' object.pk %}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Отмена
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Да, удалить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
